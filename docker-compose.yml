version: '3.8'

services:
  db:
    image: mysql:8
    container_name: xpro_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: xpro_support_db
      MYSQL_USER: xpro
      MYSQL_PASSWORD: rootpassword
    # port not exposed — only accessible within docker network
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: xpro_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: xpro_api
    restart: unless-stopped
    # port not exposed — nginx proxies to api:8000
    environment:
      - DATABASE_URL=mysql+aiomysql://root:rootpassword@db:3306/xpro_support_db
      - CORS_ORIGINS=*
      - AUTH_JWT_SECRET=your-secret-key-here
      - AUTH_JWT_ALG=HS256
      - AUTH_JWT_EXP_MINUTES=15
      - AUTH_REFRESH_TOKEN_KEY=your-secret-secret-key-here
      - AUTH_REFRESH_TOKEN_EXP=30d
      - AUTH_SECURE_COOKIES=true
      - TG_BOT_TOKEN=
      - INTERNAL_API_SECRET=change-this-to-a-random-secret-string
      - MAX_UPLOAD_SIZE_MB=20
    volumes:
      - api_uploads:/app/uploads
      - vapid_keys:/app/keys
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: xpro_bot
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+aiomysql://root:rootpassword@db:3306/xpro_support_db
      - API_URL=http://api:8000
      - TG_BOT_TOKEN=
      - INTERNAL_API_SECRET=change-this-to-a-random-secret-string
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: xpro_front
    restart: unless-stopped
    # port not exposed — nginx proxies to front:3000
    environment:
      - NODE_ENV=production
      - NUXT_API_TARGET=http://api:8000
      - NUXT_PUBLIC_API_BASE=https://xpro.sn4s.pp.ua
    depends_on:
      - api

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: xpro_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - front
      - api

volumes:
  db_data:
  api_uploads:
  vapid_keys:
